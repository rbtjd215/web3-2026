<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Web3.0 개념과 개발</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    max-width: 480px;
  }

  h1 {
    font-size: 1.6rem;
    line-height: 1.4;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.name {
    font-size: 1.2rem;
    letter-spacing: 2px;
    margin-top: 12px;
    color: #e0f7fa;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: #00c6ff;
    margin: 20px auto;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>2026 Web3.0 개념과 개발</h1>
    <div class="divider"></div>
    <p class="name">박규성</p>
  </div>
</body>
</html>
